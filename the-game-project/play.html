<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play The Game" />
    <title>Play Game | The Game</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/game.js"></script>
  </head>
  <body>
    <header>
      <h1>The Game</h1>
      <nav class="nav" id="nav">
        <button class="menu-button" id="menu-button" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="play.html" aria-current="page">play Game</a></li>
          <li><a href="contact.html">contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="site-main" tabindex="-1">
      <h2 class="hidden">Play Game</h2>
      <div id="game" class="game-area">
        <div id="start-screen" class="centered-button">
          <button type="button" id="play-button" class="button play-button">Play Game</button>
        </div>
        <div id="scene" class="scene" hidden>
          <p id="status" class="status" aria-live="polite"></p>
          <div class="stage">
            <div id="player" class="player">
              <div class="player-sprite">
                <img id="player-passive" class="player-passive" src="images/warrior-passive.png" alt="" />
                <img id="player-aggressive" class="player-aggressive" src="images/warrior-aggressive.png" alt="" />
              </div>
            </div>
            <div id="battle" class="battle">
              <div id="enemy" class="enemy">
                <div class="health-bar" aria-hidden="true"><span id="enemy-health"></span></div>
                <img id="enemy-img" class="enemy-img" src="images/spider.png" alt="" />
              </div>
              <button type="button" id="attack-button" class="button attack-button">Attack</button>
            </div>
          </div>

          <button type="button" id="walk-button" class="button walk-button">Hold to walk (W)</button>
        </div>
      </div>
    </main>

    <footer>
      <p>copyright Alexander Torrente 2026</p>
    </footer>
  </body>
</html>
