<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact The Game" />
    <title>Contact | The Game</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/contact.js"></script>
  </head>
  <body>
    <header>
      <h1>The Game</h1>
      <nav class="nav" id="nav">
        <button class="menu-button" id="menu-button" aria-label="Menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="play.html">play Game</a></li>
          <li><a href="contact.html" aria-current="page">contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="card">
        <h2>contact</h2>
        <p>Found a bug or have an idea? Send me a message!</p>
        <p id="welcome" class="welcome" hidden></p>

        <!-- method="get" sends the answers to thanks.html in the URL.
             novalidate turns off the browser's pop-ups so contact.js can show its own messages. -->
        <form id="contact-form" action="thanks.html" method="get" novalidate>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required aria-describedby="name-error" />
          <span id="name-error" class="error"></span>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required aria-describedby="email-error" />
          <span id="email-error" class="error"></span>

          <label for="topic">Topic</label>
          <select id="topic" name="topic" required aria-describedby="topic-error">
            <option value="">Choose a topic</option>
            <!-- The other options are loaded from data/topics.json -->
          </select>
          <span id="topic-error" class="error"></span>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required aria-describedby="message-error"></textarea>
          <span id="message-error" class="error"></span>

          <button type="submit" class="button">Send</button>
        </form>
      </div>
    </main>

    <footer>
      <p>copyright Alexander Torrente 2026</p>
    </footer>
  </body>
</html>
